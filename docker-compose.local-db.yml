version: '3.8'

# Docker Compose configuration using LOCAL PostgreSQL database
# Your existing database: localhost:5432, calendar_booking_db, password: admin123
# Usage: docker compose -f docker-compose.local-db.yml up -d

services:
  # Unified Backend API
  # Includes: Core Calendar API + Doctor Portal + Admin Portal + Chatbot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database - Connect to host machine's PostgreSQL
      # Use host.docker.internal to access host machine from Docker
      DATABASE_URL: postgresql+psycopg://postgres:admin123@host.docker.internal:5432/calendar_booking_db

      # Server
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}

      # Core API Auth
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-api-key}
      API_KEY_RATE_LIMIT_PER_MINUTE: 120
      API_KEY_RATE_LIMIT_BURST: 30

      # Doctor Portal Auth
      DOCTOR_PORTAL_JWT_SECRET: ${DOCTOR_PORTAL_JWT_SECRET:-doctor-jwt-secret-dev}
      DOCTOR_PORTAL_JWT_ALGORITHM: HS256
      DOCTOR_PORTAL_OAUTH_CLIENT_ID: ${DOCTOR_PORTAL_OAUTH_CLIENT_ID:-}
      DOCKER_PORTAL_OAUTH_CLIENT_SECRET: ${DOCTOR_PORTAL_OAUTH_CLIENT_SECRET:-}
      DOCTOR_PORTAL_OAUTH_REDIRECT_URI: ${DOCTOR_PORTAL_OAUTH_REDIRECT_URI:-http://localhost:8000/portal/auth/oauth/google/callback}
      DOCTOR_PORTAL_FRONTEND_CALLBACK_URL: ${DOCTOR_PORTAL_FRONTEND_CALLBACK_URL:-http://localhost:5173/doctor/oauth/callback}

      # Admin Portal Auth
      ADMIN_PORTAL_JWT_SECRET: ${ADMIN_PORTAL_JWT_SECRET:-admin-jwt-secret-dev}
      ADMIN_PORTAL_JWT_ALGORITHM: HS256
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}

      # Chatbot (OpenAI)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      OPENAI_TEMPERATURE: 0.7
      OPENAI_MAX_TOKENS: 500

      # Google Calendar (disabled by default for local dev)
      DISABLE_CALENDAR_WORKERS: ${DISABLE_CALENDAR_WORKERS:-true}
      GOOGLE_CALENDAR_CREDENTIALS_PATH: ${GOOGLE_CALENDAR_CREDENTIALS_PATH:-}
      GOOGLE_CALENDAR_DELEGATED_ADMIN_EMAIL: ${GOOGLE_CALENDAR_DELEGATED_ADMIN_EMAIL:-}

      # CORS
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./credentials:/app/credentials:ro
    # Remove postgres dependency since we're using host database
    # No depends_on needed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Add extra_hosts for Linux to enable host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Unified Frontend
  # Includes: Chatbot + Doctor Portal + Admin Portal
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# No volumes needed since we're using host database
